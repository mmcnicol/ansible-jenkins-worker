---
# See docs/jenkins-worker-node.md §3.
#
# jenkins is a locked, system, key-only-SSH account with a real shell — needed
# both for the controller's SSH-launched agent and for rootless Podman /
# `systemctl --user`. It is never given a password, even during setup: every
# step below runs as root/ansible via become, not as an interactive jenkins
# login.

- name: Create jenkins system user
  ansible.builtin.user:
    name: "{{ jenkins_worker_user }}"
    system: true
    create_home: true
    home: "{{ jenkins_worker_home }}"
    shell: /bin/bash
    password_lock: true
    state: present
  register: _jenkins_user

- name: Record jenkins uid for later systemd --user / rootless Podman tasks
  ansible.builtin.set_fact:
    jenkins_worker_uid: "{{ _jenkins_user.uid }}"

- name: Set SELinux contexts for the jenkins home directory
  community.general.sefcontext:
    target: "{{ item.target }}"
    setype: "{{ item.setype }}"
    state: present
  loop:
    # jenkins's home is on /Dev_Data, not under /home, so the system's
    # default file-context rules for home directories don't cover it —
    # sshd silently refuses to read authorized_keys under SELinux without
    # this (confirmed against a live test VM: "Could not open user 'jenkins'
    # authorized keys ... Permission denied" — see docs/jenkins-worker-node.md
    # §12). Mirrors the same three-rule shape the default policy uses for
    # /home/<user>. The most specific rule wins, so this coexists fine with
    # podman.yml's more specific rule for the containers subdirectory.
    - target: "{{ jenkins_worker_home }}"
      setype: user_home_dir_t
    - target: "{{ jenkins_worker_home }}(/.*)?"
      setype: user_home_t
    - target: "{{ jenkins_worker_home }}/\\.ssh(/.*)?"
      setype: ssh_home_t
  loop_control:
    label: "{{ item.setype }}"
  register: _jenkins_home_fcontext
  when: ansible_selinux.status is defined and ansible_selinux.status == "enabled"
  notify: Apply jenkins home SELinux context

- name: Install authorized_keys for jenkins (controller agent-launch key)
  ansible.posix.authorized_key:
    user: "{{ jenkins_worker_user }}"
    key: "{{ item }}"
    state: present
  loop: "{{ jenkins_worker_authorized_keys }}"
  when: jenkins_worker_authorized_keys | length > 0

- name: Check for an existing subuid range
  # Not `getent subuid` — confirmed on a live test VM that "subuid" isn't a
  # database getent recognises there ("Unknown database: subuid"), which
  # always returned rc=1 and made the usermod task below re-run, and report
  # changed, on every single invocation regardless of actual state.
  ansible.builtin.command: "grep -q ^{{ jenkins_worker_user }}: /etc/subuid"
  register: _subuid_check
  changed_when: false
  failed_when: false

- name: Check for an existing subgid range
  ansible.builtin.command: "grep -q ^{{ jenkins_worker_user }}: /etc/subgid"
  register: _subgid_check
  changed_when: false
  failed_when: false

- name: Assign a subuid/subgid range for rootless Podman
  ansible.builtin.command: >-
    usermod
    --add-subuids 200000-265535
    --add-subgids 200000-265535
    {{ jenkins_worker_user }}
  when: _subuid_check.rc != 0 or _subgid_check.rc != 0
  changed_when: true

- name: Check whether linger is already enabled for jenkins
  ansible.builtin.stat:
    path: "/var/lib/systemd/linger/{{ jenkins_worker_user }}"
  register: _linger_stat

- name: Enable linger for jenkins (rootless Podman / systemd --user without a login session)
  ansible.builtin.command: "loginctl enable-linger {{ jenkins_worker_user }}"
  when: not _linger_stat.stat.exists
  changed_when: true
